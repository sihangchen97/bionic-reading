<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #fff; --row: #f7f7f7; --border: #e5e5e5; --text: #1a1a1a;
      --muted: #666; --accent: #2e7d32; --off: #9e9e9e;
      --warn-bg: #fff3cd; --warn-text: #6d4c00; --kbd-bg: #e8e8e8; --kbd-border: #ccc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e; --row: #2a2a2a; --border: #3a3a3a; --text: #eee;
        --muted: #999; --warn-bg: #3a3012; --warn-text: #e5c158; --kbd-bg: #333; --kbd-border: #555;
      }
    }
    body { width: 260px; margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    header img { width: 18px; height: 18px; }
    header .name { font-weight: 600; flex: 1; }
    .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 9px; background: var(--off); color: #fff; }
    .pill.on { background: var(--accent); }
    /* whole row is the click target; focus ring on the hidden input */
    .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; cursor: pointer; user-select: none; }
    .row .label small { display: block; color: var(--muted); font-weight: 400; }
    .switch { position: relative; width: 40px; height: 22px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; z-index: 1; cursor: pointer; }
    .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
    .slider { position: absolute; inset: 0; border-radius: 11px; background: var(--off); transition: .2s; }
    .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }
    .row input:disabled + .slider { opacity: .4; }
    .row.disabled { cursor: default; }
    .row.disabled .label { color: var(--muted); }
    .status { display: none; padding: 8px 12px; color: var(--warn-text); background: var(--warn-bg); font-size: 12px; }
    .status.show { display: block; }
    .status button { margin-top: 6px; padding: 3px 10px; font: 12px inherit; border: 1px solid currentColor; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
    footer { padding: 8px 12px; color: var(--muted); font-size: 11px; background: var(--row); border-top: 1px solid var(--border); }
    kbd { background: var(--kbd-bg); border: 1px solid var(--kbd-border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 11px monospace; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon16.png" alt="">
    <span class="name">Bionic Reader</span>
    <span class="pill" id="pill">OFF</span>
  </header>
  <label class="row" for="cur">
    <span class="label">Current page<small>Bionic bolding on this tab</small></span>
    <span class="switch"><input type="checkbox" id="cur" role="switch" aria-label="Bionic bolding on this tab"><span class="slider"></span></span>
  </label>
  <label class="row" for="def">
    <span class="label">On by default<small>Bold text on newly opened pages</small></span>
    <span class="switch"><input type="checkbox" id="def" role="switch" aria-label="Bionic bolding on by default"><span class="slider"></span></span>
  </label>
  <div class="status" id="status" role="status">
    <span id="status-text">This page was opened before the extension loaded.</span><br>
    <button id="reload" type="button">Reload page</button>
  </div>
  <footer id="footer"><kbd>Alt</kbd>+<kbd>B</kbd> toggles the current page · v<span id="version"></span></footer>
  <script src="popup.js"></script>
</body>
</html>
